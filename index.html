<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<title>猫社五子棋</title>
<link rel="icon" href="data:,">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#f3ead9;
    background: radial-gradient(circle at 50% 22%, #2b2118 0%, #17110d 45%, #080706 100%);
  }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; width:100%; height:100%; touch-action:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:#0b0908; z-index:60; transition:opacity .6s; }
  #loading.hide { opacity:0; pointer-events:none; }
  #loading .ring { width:34px; height:34px; border-radius:50%; border:3px solid #4a3520; border-top-color:#e0b36a; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { font-size:13px; color:#a08a6c; letter-spacing:1px; }

  .hud { position:fixed; z-index:20; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  header.top { top:0; left:0; right:0; padding:calc(12px + env(safe-area-inset-top)) 14px 0; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:14px; background:rgba(20,15,11,.62); border:1px solid rgba(224,179,106,.22); backdrop-filter:blur(10px); }
  .brand h1 { font-size:17px; letter-spacing:1px; font-weight:700; white-space:nowrap; }
  .brand h1 span { font-size:11px; color:#e0b36a; border:1px solid rgba(224,179,106,.45); border-radius:8px; padding:1px 6px; margin-left:6px; vertical-align:middle; }
  .badges { display:flex; gap:6px; align-items:center; padding-top:4px; }
  .badge { font-size:11px; padding:4px 9px; border-radius:9px; background:rgba(255,255,255,.08); color:#cbb998; border:1px solid rgba(255,255,255,.08); white-space:nowrap; }
  .badge.ok { background:rgba(64,160,92,.22); color:#9fe3b0; border-color:rgba(64,160,92,.35); }
  .badge.warn { background:rgba(200,150,40,.18); color:#f0cd82; border-color:rgba(200,150,40,.3); }
  .badge.bad { background:rgba(190,60,50,.2); color:#ff9d90; border-color:rgba(190,60,50,.35); }
  .badge.ffa { background:rgba(190,80,50,.25); color:#ffb59b; border-color:rgba(190,80,50,.4); }

  .top-actions { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .chip-btn {
    font:inherit; font-size:12px; color:#e8d9bd; background:rgba(20,15,11,.62); border:1px solid rgba(224,179,106,.25);
    border-radius:11px; padding:7px 10px; cursor:pointer; backdrop-filter:blur(10px); text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .chip-btn:active { transform:scale(.96); background:rgba(60,45,30,.75); }
  .chip-btn.primary { border-color:rgba(224,179,106,.5); color:#f6dfb2; }

  .bottom { left:0; right:0; bottom:0; padding:0 12px calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:8px; }
  #statusBar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
    background:rgba(20,15,11,.7); border:1px solid rgba(224,179,106,.2); border-radius:14px;
    padding:8px 14px; font-size:13px; backdrop-filter:blur(12px); max-width:640px;
  }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.35); flex:none; }
  .dot.black { background:radial-gradient(circle at 35% 30%, #777, #0b0b0b); }
  .dot.white { background:radial-gradient(circle at 35% 30%, #fff, #cfc9bd); }
  .dot.red { background:radial-gradient(circle at 35% 30%, #ff8a7a, #a4170e); }
  .dot.blue { background:radial-gradient(circle at 35% 30%, #7cc0ff, #123c7d); }
  #myTeamChip { font-size:11px; padding:2px 9px; border-radius:9px; background:#5c4a35; color:#fff; }
  #myTeamChip.black { background:#1b1b1b; color:#f0e7d6; }
  #myTeamChip.white { background:#efe8d9; color:#3a2f22; }
  #myTeamChip.red { background:#9e1f16; color:#fff; }
  #myTeamChip.blue { background:#1b3f7a; color:#dfe9ff; }
  #moveInfo { color:#b7a17f; font-size:11px; width:100%; text-align:center; }
  .actions { display:flex; gap:8px; }
  .actions button { font:inherit; font-size:13px; color:#f0e3c9; background:rgba(20,15,11,.7); border:1px solid rgba(224,179,106,.25); border-radius:12px; padding:9px 18px; cursor:pointer; backdrop-filter:blur(10px); }
  .actions button:active { transform:scale(.96); background:rgba(70,52,32,.8); }
  .actions button:disabled, .chip-btn:disabled { opacity:.45; cursor:not-allowed; }

  .hint { font-size:10px; color:#7e6b50; letter-spacing:.5px; }

  #panel {
    position:fixed; z-index:30; top:calc(64px + env(safe-area-inset-top)); right:12px; width:300px; max-height:calc(100vh - 160px);
    background:rgba(18,13,10,.88); border:1px solid rgba(224,179,106,.22); border-radius:16px; padding:14px;
    backdrop-filter:blur(16px); overflow-y:auto; transform:translateX(20px); opacity:0; pointer-events:none; transition:.25s;
  }
  #panel.open { transform:none; opacity:1; pointer-events:auto; }
  #panel h2 { font-size:12px; color:#a08a6c; font-weight:600; letter-spacing:1px; margin:6px 0 6px; }
  #panel .panel-head { display:flex; align-items:center; justify-content:space-between; }
  #panel .panel-head h2 { margin:0; }
  #panelClose { font:inherit; color:#c9b795; background:none; border:none; font-size:16px; cursor:pointer; padding:2px 6px; }
  .team-row { display:flex; gap:8px; font-size:12px; padding:5px 0; align-items:baseline; border-bottom:1px dashed rgba(255,255,255,.05); }
  .team-row .t { flex:none; width:72px; font-weight:600; color:#e7d5b4; }
  .team-row .names { color:#c2b092; line-height:1.7; word-break:break-all; }
  .team-row .empty { color:#6f604b; }
  #log { font-size:11px; color:#9c8a70; line-height:1.9; max-height:220px; overflow-y:auto; }
  #log div { border-bottom:1px dashed rgba(255,255,255,.04); padding:2px 0; }

  #toast {
    position:fixed; left:50%; bottom:calc(120px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(12px);
    background:rgba(30,24,18,.94); color:#f3e6cf; font-size:13px; padding:10px 18px; border-radius:22px;
    opacity:0; transition:.25s; pointer-events:none; z-index:50; max-width:86vw; text-align:center;
    border:1px solid rgba(224,179,106,.25);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #entry { position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(5,4,3,.66); backdrop-filter:blur(4px); }
  #entry.hidden { display:none; }
  .entry-card { width:100%; max-width:380px; max-height:88vh; overflow-y:auto; background:rgba(22,16,12,.97); border:1px solid rgba(224,179,106,.3); border-radius:18px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .entry-card h3 { font-size:18px; text-align:center; margin-bottom:4px; color:#f6e6c9; }
  .entry-card .tip { font-size:12px; color:#a08a6c; text-align:center; margin-bottom:14px; line-height:1.6; }
  #nameInput { width:100%; font:inherit; font-size:16px; color:#f4e8d2; padding:11px 12px; border-radius:11px; border:1px solid rgba(224,179,106,.28); background:rgba(255,255,255,.05); margin-bottom:12px; }
  #nameInput:focus { outline:none; border-color:#e0b36a; }
  .side-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-bottom:8px; padding:12px; font:inherit; font-size:15px; color:#efe1c7; background:rgba(255,255,255,.05); border:1px solid rgba(224,179,106,.2); border-radius:12px; cursor:pointer; }
  .side-btn:active { background:rgba(255,255,255,.12); }
  .side-btn:disabled { opacity:.5; cursor:not-allowed; }
  .sdot { width:15px; height:15px; border-radius:50%; border:1px solid rgba(0,0,0,.35); flex:none; }
  #entryCancel { width:100%; padding:10px; font:inherit; font-size:13px; color:#b9a586; background:none; border:none; cursor:pointer; }
  #modeModal { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(5,4,3,.7); backdrop-filter:blur(4px); }
  #modeModal.hidden { display:none; }
  .mode-card { width:100%; max-width:420px; background:rgba(22,16,12,.98); border:1px solid rgba(224,179,106,.3); border-radius:18px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .mode-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .mode-head h3 { font-size:18px; color:#f6e6c9; margin:0; }
  #modeClose { font:inherit; color:#c9b795; background:none; border:none; font-size:16px; cursor:pointer; padding:2px 6px; }
  .mode-tip { font-size:12px; color:#a08a6c; margin:0 0 12px; line-height:1.5; }
  .mode-option { display:flex; flex-direction:column; gap:4px; width:100%; text-align:left; margin-bottom:8px; padding:12px 14px; font:inherit; color:#efe1c7; background:rgba(255,255,255,.05); border:1px solid rgba(224,179,106,.2); border-radius:12px; cursor:pointer; }
  .mode-option:active { background:rgba(255,255,255,.12); }
  .mode-option.current { border-color:#e0b36a; background:rgba(224,179,106,.12); }
  .mode-name { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .mode-desc { font-size:11px; color:#a08a6c; line-height:1.5; }
  .mode-tag { font-size:10px; color:#e0b36a; border:1px solid rgba(224,179,106,.45); border-radius:8px; padding:1px 6px; }

  @media (max-width: 720px) {
    .brand h1 { font-size:15px; }
    .brand { padding:7px 10px; }
    .badges { order:3; width:100%; padding-top:2px; }
    .top-actions { gap:5px; }
    .chip-btn { font-size:11px; padding:6px 8px; }
    #panel { top:auto; bottom:calc(96px + env(safe-area-inset-bottom)); left:12px; right:12px; width:auto; max-height:52vh; transform:translateY(20px); }
    #panel.open { transform:none; }
    #statusBar { font-size:12px; gap:6px; padding:7px 10px; }
    .actions button { padding:8px 14px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading"><div class="ring"></div><p>正在铺开棋盘…</p></div>

<header class="hud top">
  <div class="brand"><h1>猫社五子棋 <span>3D</span></h1></div>
  <div class="badges">
    <span id="netBadge" class="badge warn">加载中…</span>
    <span id="modeBadge" class="badge">双人接力</span>
  </div>
  <div class="top-actions">
    <button class="chip-btn" id="btnProfile">👤 名字/座位</button>
    <button class="chip-btn" id="btnMode">🎲 换模式</button>
    <button class="chip-btn primary" id="btnPanel">☰ 房间</button>
  </div>
</header>

<div class="hud bottom">
  <div id="statusBar">
    <span id="turnDot" class="dot black"></span>
    <span id="turnText">轮到黑方</span>
    <span id="myTeamChip">未加入</span>
    <span id="moveInfo">第 1 手 · 黑方先行</span>
  </div>
  <div class="actions">
    <button id="btnUndo">↩ 悔棋</button>
    <button id="btnSwap" style="display:none" title="黑方第一手后，白方可以选择换边">🔁 交换黑白</button>
    <button id="btnNew">🔄 新局</button>
  </div>
  <div class="hint">拖动旋转 · 滚轮/双指缩放 · 点两下同一交叉点确认落子</div>
</div>

<aside id="panel">
  <div class="panel-head"><h2>在场群友</h2><button id="panelClose">✕</button></div>
  <div id="rosterRows"></div>
  <h2>房间动态</h2>
  <div id="log"></div>
</aside>

<div id="entry" class="hidden">
  <div class="entry-card">
    <h3 id="entryTitle">加入房间</h3>
    <p class="tip" id="entryTip">输入昵称，选择你要加入的一方</p>
    <input id="nameInput" maxlength="10" placeholder="你的名字（群里怎么叫你就填啥）">
    <div id="seatList"></div>
    <button id="entryCancel" style="display:none">取消</button>
  </div>
</div>

<div id="modeModal" class="hidden">
  <div class="mode-card">
    <div class="mode-head"><h3>选择模式</h3><button id="modeClose">✕</button></div>
    <p class="mode-tip">切换模式会清空当前棋盘</p>
    <div id="modeList"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function loadMqtt(fallbacks) {
  if (!fallbacks.length) return;
  var s = document.createElement('script');
  s.src = fallbacks[0];
  s.onload = function () { if (!window.mqtt) loadMqtt(fallbacks.slice(1)); };
  s.onerror = function () { loadMqtt(fallbacks.slice(1)); };
  document.head.appendChild(s);
})([
  'https://fastly.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js',
  'https://gcore.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js',
  'https://jsd.cdn.zzko.cn/npm/mqtt@4.3.7/dist/mqtt.min.js',
  'https://cdn.jsdelivr.us/npm/mqtt@4.3.7/dist/mqtt.min.js',
  'https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js'
]);
</script>

<script type="module">
import * as THREE from './vendor/three.module.min.js';

/* ================= 常量 ================= */
const N = 15;
const COLS = 'ABCDEFGHIJKLMNO';
const S = 1;
const HALF = (N - 1) / 2;
const ROOM_KEY = 'wzq-r2-m8qk3x';
const LS_PROFILE = 'wzq_room_profile_v1';
const LS_STATE = 'wzq_room_state_v1';
const SEAT_NAMES = { 0: '观战', 1: '黑方', 2: '白方', 3: '褐方', 4: '灰方' };
const SEAT_CLASS = { 0: '', 1: 'black', 2: 'white', 3: 'brown', 4: 'gray' };
const MODE_NAME = { team: '双人接力', ffa: '四人乱战', '2v2': '2v2 黑褐 vs 白灰' };
const MODE_INFO = [
  { id: 'team', name: '双人接力', desc: '2 人一对一，白方可在黑方第一手后选择换边' },
  { id: 'ffa', name: '四人乱战', desc: '4 人每人一色，各自连成五子' },
  { id: '2v2', name: '2v2 黑褐 vs 白灰', desc: '4 人四色，黑+褐 vs 白+灰，同队两色合计五连' }
];
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const T_STATE = ROOM_KEY + '/state';
const T_EVT = ROOM_KEY + '/evt';
const T_ACT = ROOM_KEY + '/act';
const whoTopic = id => ROOM_KEY + '/who/' + id;
const STONE_HEX = { 1: 0x111112, 2: 0xf5efe2, 3: 0x8b5a2b, 4: 0x9aa0a6 };

/* ================= 状态 ================= */
const state = { mode: 'team', moves: [], owners: [], log: [], winner: 0, winLine: null, pending: null, seq: 0, hostId: null, turn: 1, swapped: false };
let board = [];
let peers = new Map();
let profile = null;
let lastStateAt = 0;
const net = { client: null, connected: false, allFailed: false, scriptFailed: false, id: '', connectedAt: 0, wasHost: false, started: false, hintShown: false };

const $ = id => document.getElementById(id);

/* ================= 规则（与 2D 版一致） ================= */
const isFfa = () => state.mode === 'ffa';
const is2v2 = () => state.mode === '2v2';
const isFourSeat = () => state.mode === 'ffa' || state.mode === '2v2';
const teamOfSeat = s => state.mode === '2v2' ? ((s === 1 || s === 3) ? 1 : (s === 2 || s === 4) ? 2 : 0) : s;
const teamLabel = t => state.mode === '2v2' ? (t === 1 ? '黑队' : t === 2 ? '白队' : '观战') : seatName(t);
const seatLabel = s => state.mode === '2v2' && s ? seatName(s) + '（' + teamLabel(teamOfSeat(s)) + '）' : seatName(s);
const currentColor = () => isFourSeat() ? (state.turn || 1) : (state.moves.length % 2 === 0 ? 1 : 2);
const seatName = t => SEAT_NAMES[t] || '观战';
const seatClass = t => SEAT_CLASS[t] || '';
const posToXY = p => [p % N, Math.floor(p / N)];
const posName = p => { const [x, y] = posToXY(p); return COLS[x] + (N - y); };
const cellToWorld = (x, y) => new THREE.Vector3((x - HALF) * S, 0, (y - HALF) * S);

function seatOccupied(t) {
  let best = null;
  for (const r of peers.values()) {
    if (r.team !== t) continue;
    if (!best || (r.joinedAt || r.ts || 0) < (best.joinedAt || best.ts || 0) || ((r.joinedAt || r.ts || 0) === (best.joinedAt || best.ts || 0) && r.id < best.id)) best = r;
  }
  return best;
}
function nextSeat(after) {
  for (let i = 1; i <= 4; i++) {
    const s = ((after - 1 + i) % 4) + 1;
    if (seatOccupied(s)) return s;
  }
  return after || 1;
}
function firstSeat() {
  for (let s = 1; s <= 4; s++) if (seatOccupied(s)) return s;
  return 1;
}
function normalizeTurn() {
  if (!isFourSeat()) { state.turn = state.moves.length % 2 === 0 ? 1 : 2; return; }
  if (!state.turn || state.turn < 1 || state.turn > 4 || !seatOccupied(state.turn)) {
    state.turn = nextSeat(state.turn || 0);
  }
}
function rebuild() {
  board = Array.from({ length: N }, () => new Array(N).fill(0));
  state.moves.forEach((p, i) => {
    const [x, y] = posToXY(p);
    board[y][x] = state.owners[i] || (i % 2 === 0 ? 1 : 2);
  });
}
function checkWin(x, y) {
  const c = board[y][x];
  if (!c) return null;
  const team = teamOfSeat(c);
  for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const line = [[x, y]];
    for (const s of [1, -1]) {
      let nx = x + dx * s, ny = y + dy * s;
      while (nx >= 0 && nx < N && ny >= 0 && ny < N && board[ny][nx] && teamOfSeat(board[ny][nx]) === team) { line.push([nx, ny]); nx += dx * s; ny += dy * s; }
    }
    if (line.length >= 5) return line;
  }
  return null;
}
function recomputeWinner() {
  state.winner = 0; state.winLine = null;
  if (state.moves.length) {
    const [x, y] = posToXY(state.moves[state.moves.length - 1]);
    const line = checkWin(x, y);
    if (line) { state.winner = teamOfSeat(board[y][x]); state.winLine = line; }
  }
}
function sanitizeState(m, owners, mode) {
  if (!Array.isArray(m) || m.length > 225) return null;
  const seen = new Set();
  for (const p of m) {
    if (!Number.isInteger(p) || p < 0 || p > 224 || seen.has(p)) return null;
    seen.add(p);
  }
  const max = mode === 'team' ? 2 : 4;
  let own = null;
  if (Array.isArray(owners) && owners.length === m.length) {
    for (const s of owners) { if (!Number.isInteger(s) || s < 1 || s > max) return null; }
    own = owners.slice();
  } else if (mode === 'ffa' || mode === '2v2') {
    return null;
  }
  if (!own) own = m.map((_, i) => (i % 2 === 0 ? 1 : 2));
  return { moves: m, owners: own };
}
function sanitizeName(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').slice(0, 10); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addLog(text) {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
  state.log.push(hh + ':' + mm + ' ' + text);
  if (state.log.length > 80) state.log = state.log.slice(-80);
}
function normalizeProfileSeat() {
  if (state.mode === 'team' && profile && profile.team > 2) {
    profile.team = 0; saveProfile(); publishMe();
    toast('双人接力每方只能有 1 人，你已转为观战');
  }
  scheduleEnforceTeamSeats();
}
let enforceSeatTimer = null;
function scheduleEnforceTeamSeats() {
  clearTimeout(enforceSeatTimer);
  enforceSeatTimer = setTimeout(enforceTeamSeats, 650);
}
function demoteSelfSeat() {
  if (!profile || (profile.team !== 1 && profile.team !== 2)) return;
  profile.team = 0;
  saveProfile(); publishMe(); updateAll();
  toast('双人接力每方只能有 1 人，你已转为观战；等一方离开再入座');
}
function enforceTeamSeats() {
  if (state.mode !== 'team' || !profile) return;
  if (profile.team !== 1 && profile.team !== 2) return;
  if (!peers.has(net.id)) return;
  const claims = [...peers.values()].filter(r => r.team === profile.team)
    .sort((a, b) => ((a.joinedAt || a.ts || 0) - (b.joinedAt || b.ts || 0)) || a.id.localeCompare(b.id));
  if (claims.length && claims[0].id !== net.id) demoteSelfSeat();
}

function writeStone(i, owner, x, y, drop) {
  const a = stoneAnim[i];
  const e = 1 - Math.pow(1 - Math.min(1, drop), 3);
  const py = drop < 1 ? a.startY + (STONE_Y - a.startY) * e : STONE_Y;
  const s = drop < 1 ? 0.7 + 0.3 * e : 1;
  const w = cellToWorld(x, y);
  stoneDummy.position.set(w.x, py, w.z);
  stoneDummy.scale.set(s, s, s);
  stoneDummy.rotation.set(0, 0, 0);
  stoneDummy.updateMatrix();
  stones.setMatrixAt(i, stoneDummy.matrix);
  stoneColor.setHex(STONE_HEX[owner] || STONE_HEX[1]);
  stones.setColorAt(i, stoneColor);
}

function syncStones() {
  const n = state.moves.length;
  const prev = stones.count;
  for (let i = 0; i < n; i++) {
    const owner = state.owners[i] || (i % 2 === 0 ? 1 : 2);
    const [x, y] = posToXY(state.moves[i]);
    if (i >= prev) { stoneAnim[i].drop = 0; stoneAnim[i].startY = STONE_Y + 3.2; }
    writeStone(i, owner, x, y, stoneAnim[i].drop);
  }
  for (let i = n; i < prev; i++) stoneAnim[i].drop = 1;
  stones.count = n;
  stones.instanceMatrix.needsUpdate = true;
  if (stones.instanceColor) stones.instanceColor.needsUpdate = true;
}

function seedFrom(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shortestAngle(d) {
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function allowedPoint(x, z) {
  return Math.hypot(x, z) <= WALK_RADIUS && (Math.abs(x) > BOARD_HALF || Math.abs(z) > BOARD_HALF);
}
function clampArena(x, z) {
  if (Math.abs(x) <= BOARD_HALF && Math.abs(z) <= BOARD_HALF) {
    if (Math.abs(x) > Math.abs(z)) x = (x >= 0 ? 1 : -1) * (BOARD_HALF + 0.35);
    else z = (z >= 0 ? 1 : -1) * (BOARD_HALF + 0.35);
  }
  const r = Math.hypot(x, z);
  if (r > WALK_RADIUS) { x = x / r * WALK_RADIUS; z = z / r * WALK_RADIUS; }
  return { x, z };
}
function segmentHitsBoard(ax, az, bx, bz) {
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dz = bz - az;
  const p = [-dx, dx, -dz, dz];
  const q = [ax + BOARD_HALF, BOARD_HALF - ax, az + BOARD_HALF, BOARD_HALF - az];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return false; }
    else {
      const r = q[i] / p[i];
      if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
      else { if (r < t0) return false; if (r < t1) t1 = r; }
    }
  }
  return t0 <= t1;
}
function planPath(sx, sz, tx, tz) {
  if (!segmentHitsBoard(sx, sz, tx, tz)) return [[tx, tz]];
  const a0 = Math.atan2(sx, sz);
  const a1 = Math.atan2(tx, tz);
  const r0 = Math.hypot(sx, sz);
  const r1 = Math.hypot(tx, tz);
  const points = [];
  if (Math.abs(r0 - ARC_RADIUS) > 0.05) {
    const p0x = Math.sin(a0) * ARC_RADIUS, p0z = Math.cos(a0) * ARC_RADIUS;
    if (segmentHitsBoard(sx, sz, p0x, p0z)) return null;
    points.push([p0x, p0z]);
  }
  const d = shortestAngle(a1 - a0);
  const steps = Math.max(2, Math.ceil(Math.abs(d) / 0.16));
  for (let i = 1; i < steps; i++) {
    const a = a0 + d * i / steps;
    points.push([Math.sin(a) * ARC_RADIUS, Math.cos(a) * ARC_RADIUS]);
  }
  if (Math.abs(r1 - ARC_RADIUS) > 0.05) {
    const p1x = Math.sin(a1) * ARC_RADIUS, p1z = Math.cos(a1) * ARC_RADIUS;
    if (segmentHitsBoard(p1x, p1z, tx, tz)) return null;
    points.push([p1x, p1z]);
  }
  points.push([tx, tz]);
  let px = sx, pz = sz;
  for (const [x, z] of points) {
    if (segmentHitsBoard(px, pz, x, z)) return null;
    px = x; pz = z;
  }
  return points;
}
function randomArenaPoint(minR, maxR, others) {
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = minR + Math.random() * (maxR - minR);
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    if (!allowedPoint(x, z)) continue;
    if (others && others.some(o => Math.hypot(o.x - x, o.z - z) < 3.4)) continue;
    return { x, z };
  }
  return { x: 0, z: 10.5 };
}
function moveAlong(av, dt, speed) {
  let remain = speed * dt;
  while (remain > 0 && av.path && av.path.length) {
    const [tx, tz] = av.path[0];
    const dx = tx - av.x, dz = tz - av.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.001) { av.path.shift(); continue; }
    const step = Math.min(remain, d);
    av.x += dx / d * step;
    av.z += dz / d * step;
    remain -= step;
    if (step >= d - 0.001) av.path.shift();
  }
  const c = clampArena(av.x, av.z);
  av.x = c.x; av.z = c.z;
  return !av.path || av.path.length === 0;
}

function pickWalkTarget(av) {
  let fallback = null;
  for (let i = 0; i < 24; i++) {
    const pt = randomArenaPoint(9.0, 12.2);
    if (Math.hypot(pt.x - av.x, pt.z - av.z) < 1.6) continue;
    if (!segmentHitsBoard(av.x, av.z, pt.x, pt.z)) return pt;
    fallback = pt;
  }
  return fallback;
}
function moveToward(av, tx, tz, dt, speed) {
  const dx = tx - av.x, dz = tz - av.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.05) return true;
  const step = Math.min(d, speed * dt);
  av.x += dx / d * step;
  av.z += dz / d * step;
  return step >= d - 0.05;
}
function pickWeighted(entries) {
  let total = 0;
  for (const e of entries) total += e[1];
  let r = Math.random() * total;
  for (const [type, w] of entries) {
    r -= w;
    if (r <= 0) return type;
  }
  return entries[entries.length - 1][0];
}
function fightPlan(av, target) {
  const dx = target.x - av.x, dz = target.z - av.z;
  const d = Math.hypot(dx, dz) || 1;
  const stop = clampArena(target.x - dx / d * 1.25, target.z - dz / d * 1.25);
  return planPath(av.x, av.z, stop.x, stop.z);
}
function pickFightTarget(av, others) {
  const shuffled = [...others].sort(() => Math.random() - 0.5);
  for (const t of shuffled) if (!segmentHitsBoard(av.x, av.z, t.x, t.z) && fightPlan(av, t)) return t;
  for (const t of shuffled) if (fightPlan(av, t)) return t;
  return null;
}

  const av = avatars.get(d.from);
  if (!av) return;
  const now = Date.now();
  if (now - (actSeen.get(d.from) || 0) < 700) return;
  actSeen.set(d.from, now);
  startAction(av, d.a, { targetId: d.t, hit: d.hit, kind: d.kind, bx: d.bx, bz: d.bz });

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 0.85 ? 58 : 42;
  camera.updateProjectionMatrix();
  if (!userRotated) camTarget.phi = aspect < 0.85 ? 0.5 : 0.95;
  if (!userZoom) camTarget.radius = aspect < 0.85 ? 60 : 52;
}
window.addEventListener('resize', resize);

function updateCamera(dt) {
  const k = 1 - Math.pow(0.0001, dt);
  camCur.theta += (camTarget.theta - camCur.theta) * k;
  camCur.phi += (camTarget.phi - camCur.phi) * k;
  camCur.radius += (camTarget.radius - camCur.radius) * k;
  const r = camCur.radius, phi = camCur.phi, th = camCur.theta;
  camera.position.set(r * Math.sin(phi) * Math.sin(th), r * Math.cos(phi), r * Math.sin(phi) * Math.cos(th));
  camera.lookAt(CAM_LOOK);
}

const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2();

function pick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, hit)) return null;
  const gx = Math.round(hit.x / S + HALF);
  const gy = Math.round(hit.z / S + HALF);
  if (gx < 0 || gx >= N || gy < 0 || gy >= N) return null;
  const w = cellToWorld(gx, gy);
  if (Math.hypot(hit.x - w.x, hit.z - w.z) > S * 0.5) return null;
  return { x: gx, y: gy };
}

function pickAvatar(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(avatarGroup.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.peerId) o = o.parent;
    if (o && o.userData.peerId) return avatars.get(o.userData.peerId) || null;
  }
  return null;
}
let hoverCell = null;
const pointerMap = new Map();
let drag = null;
let pinchDist = 0;

function setGhost() {

  if (hoverCell && !state.pending && !state.winner && board[hoverCell.y] && board[hoverCell.y][hoverCell.x] === 0) {
    const w = cellToWorld(hoverCell.x, hoverCell.y);

    hoverRing.visible = true;

    hoverRing.visible = false;

}

function activateCell(x, y) {

  if (state.winner) { toast('本局已结束，点「新局」再开一盘'); return; }
  if (!window.mqtt) { toast('组件还在加载，稍等几秒…'); return; }
  if (!net.connected) { toast('还没连上房间，稍等几秒…'); return; }
  if (profile.team === 0) { toast('观战中，点「名字/座位」可加入一方'); return; }
  if (profile.team !== currentColor()) { toast('现在轮到' + seatName(currentColor()) + '落子'); return; }
  if (board[y][x] !== 0) {

    return;

function onPointerDown(e) {
  markActive();
  renderer.domElement.setPointerCapture && renderer.domElement.setPointerCapture(e.pointerId);
  pointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointerMap.size === 1) {
    drag = { x: e.clientX, y: e.clientY, moved: false };
  } else if (pointerMap.size === 2) {
    const [a, b] = [...pointerMap.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
}
function onPointerMove(e) {
  markActive();
  if (!pointerMap.has(e.pointerId)) {
    const cell = pick(e.clientX, e.clientY);
    hoverCell = cell;
    setGhost();
    return;
  }
  pointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointerMap.size === 2) {
    const [a, b] = [...pointerMap.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) {
      camTarget.radius = Math.max(14, Math.min(85, camTarget.radius * (pinchDist / Math.max(1, d))));
      userZoom = true;
    }
    pinchDist = d;
    if (drag) drag.moved = true;
    return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 0) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
      userRotated = true;
      camTarget.theta -= dx * 0.006;
      camTarget.phi = Math.max(0.28, Math.min(1.32, camTarget.phi - dy * 0.005));
      drag.x = e.clientX; drag.y = e.clientY;
    }
  }
}
function onPointerUp(e) {
  markActive();
  pointerMap.delete(e.pointerId);
  if (pointerMap.size < 2) pinchDist = 0;
  if (pointerMap.size === 0) {
    if (drag && !drag.moved) {
      const av = pickAvatar(e.clientX, e.clientY);
      if (av) {
        if (av.id === net.id) triggerSelfAction();
        return;
      }
      const cell = pick(e.clientX, e.clientY);
      if (cell) activateCell(cell.x, cell.y);
    }
    drag = null;
  }
}

/* ================= 网络（与 2D 版同一协议） ================= */
function decodeJson(payload) { try { return JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return null; } }
function liveHostId() {
  if (state.hostId && peers.has(state.hostId)) return state.hostId;
  if (!peers.size) return null;
  return [...peers.keys()].sort()[0];
}
function isHost() { return net.connected && peers.has(net.id) && liveHostId() === net.id; }

function ensureNet() {
  if (net.started) return;
  if (!window.mqtt) return;
  net.started = true;
  net.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  connectBroker(0);
  setInterval(publishMe, 10000);
  setInterval(gcPeers, 15000);
  setInterval(() => { if (isHost() && Date.now() - lastStateAt > 25000) publishState(); }, 10000);
  setTimeout(() => {
    if (!net.hintShown && !net.connected) {
      net.hintShown = true;
      toast('一直连不上？点 QQ 右上角菜单 →「在浏览器中打开」再试');
    }
  }, 15000);
}

function connectBroker(idx) {
  if (!window.mqtt) return;
  if (idx >= BROKERS.length) {
    net.connected = false; net.allFailed = true; updateAll();
    setTimeout(() => connectBroker(0), 15000);
    return;
  }
  let c;
  try {
    c = mqtt.connect(BROKERS[idx], {
      clientId: 'wzq3d_' + net.id, keepalive: 20, clean: true, reconnectPeriod: 0, connectTimeout: 8000,
      will: { topic: whoTopic(net.id), payload: '', qos: 1, retain: true }
    });
  } catch (e) { setTimeout(() => connectBroker(idx + 1), 200); return; }
  net.client = c;
  net.connected = false;
  let everConnected = false, dead = false;
  const guard = setTimeout(() => { if (!everConnected) onFail(); }, 11000);
  const onFail = () => {
    if (dead) return;
    dead = true;
    clearTimeout(guard);
    try { c.end(true); } catch (e) {}
    if (net.client === c) { net.client = null; net.connected = false; }
    updateAll();
    setTimeout(() => connectBroker(everConnected ? idx : idx + 1), everConnected ? 3000 : 300);
  };
  c.on('error', onFail);
  c.on('close', () => { if (everConnected) onFail(); });
  c.on('connect', () => {
    everConnected = true;
    clearTimeout(guard);
    net.connected = true;
    net.connectedAt = Date.now();
    net.allFailed = false;
    c.subscribe(ROOM_KEY + '/#', { qos: 1 });
    setTimeout(publishMe, 400);
    setTimeout(publishMe, 1600);
    setTimeout(publishMe, 4200);
    setTimeout(checkHostChange, 2500);
    updateAll();
  });
  c.on('message', onMessage);
}

function onMessage(topic, payload) {
  if (topic === T_STATE) return onState(payload);
  if (topic === T_EVT) return onEvt(payload);
  if (topic === T_ACT) return onAct(payload);
  const p = ROOM_KEY + '/who/';
  if (topic.slice(0, p.length) === p) return onWho(topic.slice(p.length), payload);
}

function onWho(id, payload) {
  const quiet = Date.now() - net.connectedAt < 3000;
  if (payload.length === 0) {
    const gone = peers.get(id);
    if (gone) {
      peers.delete(id);
      checkHostChange();
      if (isHost() && !quiet) { addLog('「' + gone.name + '」离开'); publishState(); }
      else updateAll();
    }
    return;
  }
  const d = decodeJson(payload);
  if (!d) return;
  const name = sanitizeName(d.name) || '无名群友';
  let team = [0, 1, 2, 3, 4].includes(d.team) ? d.team : 0;
  if (!isFourSeat() && team > 2) team = 0;
  const old = peers.get(id);
  const joinedAt = old && old.joinedAt ? old.joinedAt : Date.now();
  peers.set(id, { id, name, team, ts: Date.now(), joinedAt });
  if (id === net.id && d.force && profile && profile.team !== team) {
    profile.team = team;
    saveProfile();
    if (team === 0) toast('当前一方已满，你已转为观战');
    publishMe();
    updateAll();
  }
  scheduleEnforceTeamSeats();
  checkHostChange();
  if (isHost() && !quiet) {
    if (!old) { addLog('「' + name + '」加入' + seatName(team)); publishState(); }
    else if (old.name !== name || old.team !== team) { addLog('「' + name + '」切换到' + seatName(team)); publishState(); }
    else updateAll();
  } else updateAll();
}

function checkHostChange() {
  const host = isHost();
  if (host && !net.wasHost) {
    if (state.seq === 0) {
      if (Date.now() - net.connectedAt < 3000) { setTimeout(checkHostChange, 3000); return; }
      state.mode = 'team';
      state.moves = []; state.owners = []; state.log = []; state.pending = null; state.winner = 0; state.winLine = null; state.turn = 1;
      rebuild(); normalizeProfileSeat();
      addLog('房间已创建，把链接发到群里吧');
      publishState();
    } else {
      if (state.hostId && !peers.has(state.hostId) && Date.now() - net.connectedAt < 6000) {
        setTimeout(checkHostChange, 2000);
        return;
      }
      addLog('房主掉线，「' + (profile ? profile.name : '群友') + '」接管房间，棋局已恢复');
      publishState();
    }
  }
  net.wasHost = host;
}

function onState(payload) {
  const d = decodeJson(payload);
  if (!d || !Array.isArray(d.moves)) return;
  const mode = d.mode === 'ffa' ? 'ffa' : d.mode === '2v2' ? '2v2' : 'team';
  const san = sanitizeState(d.moves, d.owners, mode);
  if (!san || !Number.isInteger(d.seq) || d.seq < state.seq) return;
  if (d.host === net.id) { lastStateAt = Date.now(); net.wasHost = true; return; }
  const oldMode = state.mode;
  const oldPending = state.pending;
  state.seq = d.seq;
  state.hostId = typeof d.host === 'string' ? d.host : null;
  state.mode = mode;
  state.moves = san.moves;
  state.owners = san.owners;
  state.turn = (Number.isInteger(d.turn) && d.turn >= 1 && d.turn <= 4) ? d.turn : 1;
  state.swapped = !!d.swapped;
  if (Array.isArray(d.log)) state.log = d.log.slice(-80);
  rebuild(); recomputeWinner();
  state.pending = null;
  if (oldPending && !state.winner && profile && profile.team === currentColor() && board[oldPending.y] && board[oldPending.y][oldPending.x] === 0) {
    state.pending = oldPending;
  }
  if (oldMode !== mode) {
    normalizeProfileSeat();
    if (profile) publishMe();
  }
  scheduleEnforceTeamSeats();
  checkHostChange();
  saveRoom(); updateAll();
}

function onEvt(payload) {
  if (!isHost()) return;
  const d = decodeJson(payload);
  if (!d || typeof d.from !== 'string') return;
  if (d.k === 'move' && Number.isInteger(d.pos)) hostApplyMove(d.from, d.pos);
  else if (d.k === 'undo') hostApplyUndo(d.from);
  else if (d.k === 'reset') hostApplyReset(d.from);
  else if (d.k === 'mode') hostApplyMode(d.from, d.mode);
  else if (d.k === 'swap') hostApplySwap(d.from);
}

function sendEvt(o) {
  if (!net.client || !net.connected) return false;
  try { net.client.publish(T_EVT, JSON.stringify(Object.assign({ from: net.id }, o)), { qos: 1 }); return true; }
  catch (e) { return false; }
}
function publishMe() {
  if (!net.client || !net.connected || !profile) return;
  try { net.client.publish(whoTopic(net.id), JSON.stringify({ name: profile.name, team: profile.team }), { qos: 1, retain: true }); } catch (e) {}
}
function announceLeave() {
  try { if (net.client && net.connected) net.client.publish(whoTopic(net.id), '', { qos: 1, retain: true }); } catch (e) {}
}
function gcPeers() {
  const now = Date.now();
  const gone = [];
  peers.forEach((r, id) => { if (id !== net.id && now - r.ts > 50000) { peers.delete(id); gone.push(r); } });
  if (gone.length) {
    scheduleEnforceTeamSeats();
    checkHostChange();
    if (isHost()) { gone.forEach(r => addLog('「' + r.name + '」离开')); publishState(); }
    else updateAll();
  }
}

function hostApplyMove(key, pos) {
  normalizeTurn();
  const r = peers.get(key);
  const seat = r ? r.team : 0;
  if (state.winner || !r || !seat || seat !== currentColor() || !Number.isInteger(pos) || pos < 0 || pos > 224) { publishState(); return; }
  const [x, y] = posToXY(pos);
  if (board[y][x] !== 0) { publishState(); return; }
  state.moves.push(pos);
  state.owners.push(seat);
  state.pending = null;
  rebuild(); recomputeWinner();
  addLog('「' + r.name + '」落子 ' + posName(pos) + '（' + seatName(seat) + '）');
  if (state.winner) addLog(teamLabel(state.winner) + '五连获胜！本局共 ' + state.moves.length + ' 手 🏆');
  else state.turn = isFourSeat() ? nextSeat(seat) : (state.moves.length % 2 === 0 ? 1 : 2);
  publishState();
}
function hostApplyUndo(key) {
  if (!state.moves.length) return;
  const lastSeat = state.owners[state.owners.length - 1] || (state.moves.length % 2 === 1 ? 1 : 2);
  const r = peers.get(key);
  if (!r || r.team !== lastSeat) { publishState(); return; }
  const p = state.moves.pop();
  state.owners.pop();
  state.pending = null;
  if (!state.moves.length) state.swapped = false;
  rebuild(); recomputeWinner();
  if (!state.winner) state.turn = isFourSeat() ? (seatOccupied(lastSeat) ? lastSeat : nextSeat(lastSeat)) : (state.moves.length % 2 === 0 ? 1 : 2);
  addLog('「' + r.name + '」悔棋，撤回 ' + posName(p));
  publishState();
}
function publishWhoFor(peer, team) {
  if (!net.client || !net.connected || !peer) return;
  try { net.client.publish(whoTopic(peer.id), JSON.stringify({ name: peer.name, team, force: true }), { qos: 1, retain: true }); } catch (e) {}
}
function hostApplySwap(key) {
  if (state.mode !== 'team' || state.moves.length !== 1 || state.winner || state.swapped) return;
  const r = peers.get(key);
  if (!r || r.team !== 2) return;
  const black = seatOccupied(1);
  const white = seatOccupied(2);
  if (!black || !white || black.id === white.id) return;
  black.team = 2;
  white.team = 1;
  state.swapped = true;
  publishWhoFor(black, 2);
  publishWhoFor(white, 1);
  if (profile) {
    if (net.id === black.id) { profile.team = 2; saveProfile(); }
    else if (net.id === white.id) { profile.team = 1; saveProfile(); }
  }
  addLog('白方选择交换黑白，双方换边');
  publishState();
}
function hostApplyReset(key) {
  if (key !== net.id) { publishState(); return; }
  const r = peers.get(key);
  state.moves = []; state.owners = []; state.pending = null; state.swapped = false;
  rebuild(); state.winner = 0; state.winLine = null;
  state.turn = isFourSeat() ? firstSeat() : 1;
  addLog('「' + (r ? r.name : '?') + '」发起新局，' + (isFourSeat() ? seatName(state.turn) + '先手' : '黑方先行'));
  publishState();
}
function hostApplyMode(key, mode) {
  if (key !== net.id) { publishState(); return; }
  if (mode !== 'ffa' && mode !== 'team' && mode !== '2v2') return;
  state.mode = mode;
  state.moves = []; state.owners = []; state.pending = null; state.swapped = false;
  rebuild(); state.winner = 0; state.winLine = null;
  state.turn = isFourSeat() ? firstSeat() : 1;
  const r = peers.get(key);
  addLog('「' + (r ? r.name : '?') + '」切换为' + MODE_NAME[mode] + '模式，棋盘已重置');
  normalizeProfileSeat();
  publishState();
}
function publishState() {
  if (!net.client || !net.connected) { updateAll(); return; }
  normalizeTurn();
  state.seq = state.seq + 1;
  state.hostId = net.id;
  lastStateAt = Date.now();
  try {
    net.client.publish(T_STATE, JSON.stringify({
      seq: state.seq, host: net.id, mode: state.mode, swapped: state.swapped,
      moves: state.moves, owners: state.owners, turn: state.turn,
      log: state.log.slice(-80)
    }), { qos: 1, retain: true });
  } catch (e) {}
  saveRoom(); updateAll();
}

function waitMqtt(attempt) {
  if (window.mqtt) {
    net.scriptFailed = false;
    updateNetUI();
    ensureNet();
    return;
  }
  if (attempt === 20) {
    net.scriptFailed = true;
    updateNetUI();
    toast('网络组件加载较慢，仍在后台重试…');
  }
  setTimeout(() => waitMqtt(attempt + 1), attempt > 20 ? 2000 : 500);
}

/* ================= 操作 ================= */
function doPlace(x, y) {
  const pos = y * N + x;
  if (isHost()) { hostApplyMove(net.id, pos); return; }
  if (!net.connected) { toast('还没连上房间'); return; }
  state.moves.push(pos);
  state.owners.push(profile.team);
  state.pending = null;
  rebuild(); recomputeWinner();
  updateAll();
  if (!sendEvt({ k: 'move', pos })) toast('还没连上房间');
}

$('btnUndo').addEventListener('click', function () {
  if (!state.moves.length) { toast('还没有落子'); return; }
  if (!profile || profile.team === 0) { toast('观战不能悔棋'); return; }
  const lastSeat = state.owners[state.owners.length - 1] || (state.moves.length % 2 === 1 ? 1 : 2);
  if (profile.team !== lastSeat) { toast('这手是' + seatName(lastSeat) + '下的，由他们发起悔棋'); return; }
  const p = state.moves[state.moves.length - 1];
  if (!confirm('撤回最后一手（' + posName(p) + '）？')) return;
  if (isHost()) hostApplyUndo(net.id);
  else if (!sendEvt({ k: 'undo' })) toast('还没连上房间');
});
$('btnNew').addEventListener('click', function () {
  if (!isHost()) { toast('只有房主可以发起新局'); return; }
  if (!confirm('发起新的一局？棋盘清空，' + (isFourSeat() ? '按座位顺序先手' : '黑方先行') + '。')) return;
  hostApplyReset(net.id);
});
$('btnSwap').addEventListener('click', function () {
  if (state.mode !== 'team' || state.moves.length !== 1 || state.winner || state.swapped) return;
  if (!profile || profile.team !== 2) { toast('只有白方可以选择交换'); return; }
  if (isHost()) hostApplySwap(net.id);
  else if (!sendEvt({ k: 'swap' })) toast('还没连上房间');
});
function openModeModal() {
  if (!isHost()) { toast('只有房主可以切换模式'); return; }
  if (!net.connected) { toast('还没连上房间'); return; }
  if (!peers.size) { toast('正在进入房间，稍等一秒再试'); return; }
  $('modeList').innerHTML = MODE_INFO.map(m => {
    const cur = m.id === state.mode;
    return '<button class="mode-option' + (cur ? ' current' : '') + '" data-mode="' + m.id + '">'
      + '<span class="mode-name">' + m.name + (cur ? '<span class="mode-tag">当前</span>' : '') + '</span>'
      + '<span class="mode-desc">' + m.desc + '</span></button>';
  }).join('');
  $('modeModal').classList.remove('hidden');
}
function closeModeModal() { $('modeModal').classList.add('hidden'); }
function applyModeChoice(mode) {
  if (!MODE_NAME[mode]) return;
  closeModeModal();
  if (!isHost()) { toast('只有房主可以切换模式'); return; }
  if (mode === state.mode) { toast('已经是「' + MODE_NAME[mode] + '」模式'); return; }
  if (!net.connected) { toast('还没连上房间'); return; }
  if (isHost()) hostApplyMode(net.id, mode);
  else if (!sendEvt({ k: 'mode', mode })) toast('还没连上房间');
}
$('btnMode').addEventListener('click', openModeModal);
$('modeClose').addEventListener('click', closeModeModal);
$('modeModal').addEventListener('click', e => { if (e.target === $('modeModal')) closeModeModal(); });
$('modeList').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]');
  if (b) applyModeChoice(b.getAttribute('data-mode'));
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModeModal(); });
$('btnProfile').addEventListener('click', () => showEntry(true));
$('btnPanel').addEventListener('click', () => $('panel').classList.toggle('open'));
$('panelClose').addEventListener('click', () => $('panel').classList.remove('open'));
$('seatList').addEventListener('click', function (e) {
  const b = e.target.closest('[data-seat]');
  if (!b || b.disabled) return;
  submitEntry(parseInt(b.getAttribute('data-seat'), 10));
});
$('entryCancel').addEventListener('click', () => $('entry').classList.add('hidden'));

/* ================= 启动/渲染循环 ================= */
window.addEventListener('pagehide', announceLeave);
window.addEventListener('beforeunload', announceLeave);

let lastT = performance.now();
let firstFrame = true;
let lastActive = performance.now();
let idleTick = 0;
function markActive() { lastActive = performance.now(); }
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
  lastT = now;
  updateCamera(dt);
  let anyDrop = false;
  for (let i = 0; i < stones.count; i++) {
    const a = stoneAnim[i];
    if (a.drop < 1) {
      a.drop = Math.min(1, a.drop + dt * 2.6);
      const owner = state.owners[i] || (i % 2 === 0 ? 1 : 2);
      const [x, y] = posToXY(state.moves[i]);
      writeStone(i, owner, x, y, a.drop);
      anyDrop = true;
    }
  }
  if (anyDrop) {
    stones.instanceMatrix.needsUpdate = true;
    if (stones.instanceColor) stones.instanceColor.needsUpdate = true;
    renderer.shadowMap.needsUpdate = true;
  }
  const pulse = 0.5 + 0.5 * Math.sin(now / 380);
  lastRing.material.opacity = 0.55 + 0.35 * pulse;
  lastRing.scale.setScalar(1 + 0.04 * pulse);
  ghostRing.material.opacity = 0.45 + 0.3 * pulse;
  if (winGroup.children.length) {
    for (const c of winGroup.children) {
      if (c.material) c.material.opacity = 0.65 + 0.3 * pulse;
    }
  }
  if (now - lastActive > 8000 && pointerMap.size === 0 && !drag && !anyDrop) {
    idleTick ^= 1;
    if (idleTick) return;
  }
  dust.rotation.y += dt * 0.02;
  dust.position.y = Math.sin(now / 4000) * 0.3;
  updateAvatarActions(dt, now);
  updatePoops(dt);
  renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    $('loading').classList.add('hide');
    if (new URLSearchParams(location.search).has('test')) exposeTest();
  }
}

function exposeTest() {
  window.__wzq3d = {
    state, peers, net, camera, renderer, scene, updateAll, avatars, poops, startAction, triggerSelfAction, pickWeighted,
    rebuild, recomputeWinner, teamOfSeat, teamLabel, seatLabel, currentColor, normalizeTurn, hostApplyMove,
    getProfile: () => profile,
    activateCell,
    stoneCount: () => stones.count,
    screenPoint: (x, y) => {
      const w = cellToWorld(x, y);
      const v = w.clone().project(camera);
      return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
    }
  };
}

function initGame() {
  profile = loadProfile();
  const saved = loadSavedState();
  if (saved) {
    const mode = saved.mode === 'ffa' ? 'ffa' : saved.mode === '2v2' ? '2v2' : 'team';
    const san = sanitizeState(saved.moves, saved.owners, mode);
    if (san) { state.mode = mode; state.moves = san.moves; state.owners = san.owners; }
    state.log = Array.isArray(saved.log) ? saved.log.slice(-80) : [];
    state.turn = (Number.isInteger(saved.turn) && saved.turn >= 1 && saved.turn <= 4) ? saved.turn : 1;
    state.swapped = !!saved.swapped;
    rebuild(); recomputeWinner();
  }
  if (!profile) showEntry(false);
  waitMqtt(0);
  updateAll();
  requestAnimationFrame(animate);
}
initGame();
</script>
